<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — The Sportscast</title>
  <meta name="description" content="Search The Sportscast — stories, shows, teams, players, and competitions.">
  <meta property="og:image" content="/brand/social/og-gold-1200x630.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;600;700;900&family=Anton&display=swap" rel="stylesheet">
  <link rel="icon" href="/brand/favicon/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/brand/favicon/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/brand/favicon/favicon-180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D0D0D">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="sticky-chrome">
    <div id="nav-placeholder"></div>
    <div id="subnav-placeholder"></div>
  </div>

  <header class="page-header">
    <div class="container">
      <h1 class="page-title">Search</h1>
      <form method="get" style="margin-top:1rem;">
        <input type="search" name="q" id="search-input" placeholder="Search stories, shows, teams, players, competitions…" style="width:100%; max-width:480px;" autocomplete="off" minlength="2">
        <button type="submit" class="btn-outline-sm">Search</button>
      </form>
    </div>
  </header>

  <div class="page-body">
    <div class="container" id="search-results">
      <p class="empty-state">Enter a search term above.</p>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/nav-dropdown.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/push.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
