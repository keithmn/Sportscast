<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submissions — The Sportscast Newsroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;600;700;900&family=Anton&display=swap" rel="stylesheet">
  <link rel="icon" href="/brand/favicon/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/brand/favicon/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/brand/favicon/favicon-180.png">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-nav" aria-label="Newsroom"></aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <h1 class="page-title" style="font-size:1.75rem;">Submissions</h1>
        <span id="whoami" class="page-sub"></span>
      </div>
      <p class="page-sub" style="margin-bottom:2rem;">Contact messages, news tips, partnership inquiries, and shop-waitlist signups from the homepage — all in one inbox, distinguished by type.</p>
      <div id="access-denied" class="form-error" style="display:none;">You don't have permission to view this.</div>
      <div id="submissions-app" style="display:none;">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Type</th><th>Name</th><th>Email</th><th>Message</th><th>Received</th><th>Status</th><th></th></tr></thead>
            <tbody id="submissions-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/site.js"></script>
  <script src="/admin/js/nav.js"></script>
  <script src="/admin/js/guard.js"></script>
  <script src="/admin/js/submissions.js"></script>
</body>
</html>
