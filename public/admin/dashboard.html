<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsroom Dashboard — The Sportscast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;600;700;900&family=Anton&display=swap" rel="stylesheet">
  <link rel="icon" href="/brand/favicon/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/brand/favicon/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/brand/favicon/favicon-180.png">
  <link rel="stylesheet" href="/css/site.css">
<style>
    .todo-group { border-left: 4px solid var(--border); padding: 0.4rem 0 0.4rem 1rem; margin-bottom: 1.75rem; max-width: 760px; }
    .todo-group.urgent { border-left-color: var(--danger); }
    .todo-group.act { border-left-color: var(--brand-gold); }
    .todo-group.clear { border-left-color: var(--success); }
    .todo-group h2 { font-size: 1.05rem; margin: 0 0 0.35rem; }
    .todo-group ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.15rem; }
    .todo-group li { display: flex; flex-wrap: wrap; gap: 0.15rem 0.75rem; align-items: baseline; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .todo-group li a { font-weight: 600; color: var(--text-primary); }
    .todo-meta, .todo-note { font-size: 0.8rem; color: var(--text-secondary); }
    .todo-note { margin: 0 0 0.4rem; }
    .todo-more { display: inline-block; margin-top: 0.5rem; font-size: 0.85rem; font-weight: 700; }
</style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-nav" aria-label="Newsroom"></aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <h1 class="page-title" style="font-size:1.75rem;">Dashboard</h1>
        <span id="whoami" class="page-sub"></span>
      </div>
      <div id="dashboard-root"></div>
    </main>
  </div>

  <script src="/js/site.js"></script>
  <script src="/admin/js/nav.js"></script>
  <script src="/admin/js/guard.js"></script>
  <script src="/admin/js/dashboard.js"></script>
</body>
</html>
