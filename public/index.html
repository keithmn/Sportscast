<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Sportscast, by Underdawgs — Where Kenyan sports live. The flagship show, five sport-specific weeklies, and a growing archive of Kenyan sport.">
  <title>The Sportscast — Where Kenyan Sports Live.</title>
  <meta property="og:title" content="The Sportscast, by Underdawgs">
  <meta property="og:description" content="Where Kenyan sports live. The flagship show, five sport-specific weeklies, and a growing archive of Kenyan sport.">
  <meta property="og:image" content="/brand/social/og-gold-1200x630.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/brand/favicon/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/brand/favicon/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/brand/favicon/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;600;700;900&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>

<!-- 2026-08-20: homepage rebuilt to use the shared header/nav/footer
     (site.js) like every other page, instead of its own hardcoded
     nav+hero markup — the hero this nav used to float over is gone, so
     the divergence that justified a separate nav no longer applies. -->
<div id="header-placeholder"></div>
<div class="sticky-chrome">
  <div id="nav-placeholder"></div>
  <div id="subnav-placeholder"></div>
</div>

<!-- 2026-08-20: homepage strictly for news now — no hero, no podcast/
     show teasers, no shop/newsletter promos (all still live on their own
     pages: /shows.html, /shop.html). Sports tiles (quick jump into a
     hub) and the "Latest" briefs teaser are the two non-article elements
     the client chose to keep; everything else was a summary of a part of
     the site that already has its own page. -->
<section class="sports-section" aria-label="Sports">
  <div class="container">
    <span class="section-label fade-up">Sports</span>
    <div class="sports-grid fade-up" id="sports-tiles-grid">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</section>

<section class="whats-on-section fade-up" id="whats-on" aria-label="What's on">
  <div class="container">
    <span class="section-label fade-up">What&apos;s On</span>
    <div class="whats-on-list fade-up" id="whats-on-list">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</section>

<section class="stories-section" id="top-stories" aria-label="Top stories">
  <div class="container">
    <span class="section-label fade-up">Top Stories</span>
    <div class="fade-up">
      <div class="stories-r1" id="stories-r1"></div>
      <div class="stories-r2" id="stories-r2"></div>
    </div>
  </div>
</section>

<section class="archive-teaser-section" id="stories" aria-label="Latest news">
  <div class="container">
    <span class="section-label fade-up">Latest</span>
    <p class="archive-teaser-sub fade-up">Quick, factual updates — not a firehose, just the day-to-day. <a href="/news.html">See all news &amp; articles →</a></p>

    <!-- populated live from /api/articles by js/home.js -->
    <div class="archive-list fade-up" id="archive-list"></div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="/js/nav-dropdown.js"></script>
<script src="/js/site.js"></script>
<script src="/js/scores.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
