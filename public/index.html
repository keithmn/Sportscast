<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Sportscast, by Underdawgs — Where Kenyan sports live. The flagship show and a growing archive of Kenyan sport.">
  <title>The Sportscast — Where Kenyan Sports Live.</title>
  <meta property="og:title" content="The Sportscast, by Underdawgs">
  <meta property="og:description" content="Where Kenyan sports live. The flagship show and a growing archive of Kenyan sport.">
  <meta property="og:image" content="/brand/social/og-gold-1200x630.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/brand/favicon/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/brand/favicon/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/brand/favicon/favicon-180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D0D0D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;600;700;900&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>

<!-- 2026-08-20: homepage rebuilt to use the shared header/nav/footer
     (site.js) like every other page, instead of its own hardcoded
     nav+hero markup — the hero this nav used to float over is gone, so
     the divergence that justified a separate nav no longer applies. -->
<div id="header-placeholder"></div>
<div class="sticky-chrome">
  <div id="nav-placeholder"></div>
  <div id="subnav-placeholder"></div>
</div>

<!-- 2026-08-20: homepage strictly for news, no hero/podcast/shop promos.
     2026-09-13: reordered from taxonomy-first (Sports → Following → What's
     On → Stories → Latest) to time-and-fan-intent-first — a visitor should
     find "what matters right now" before "what this site contains". Order
     is now: lead story (TOP) → live/upcoming (NOW) → episodes (WATCH) →
     Kenyan competitions (LOCAL) → personal follows (FOLLOW) → the rest of
     today's editorial (READ) → browse by sport (DISCOVER, was "Sports",
     kept that honest label — these are the major sports, not just the
     lesser-covered ones, so "Discover" would overclaim what it is). -->

<!-- TOP: the single lead story, alone — no secondary items beside it,
     those moved to READ further down. -->
<section class="lead-section fade-up" id="lead-section" aria-label="Lead story">
  <div class="container">
    <div class="fade-up" id="lead-story-root"></div>
  </div>
</section>

<!-- NOW -->
<section class="whats-on-section fade-up" id="whats-on" aria-label="What's on">
  <div class="container">
    <span class="section-label fade-up">What&apos;s On</span>
    <div class="whats-on-list fade-up" id="whats-on-list">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</section>

<!-- WATCH: flagship episodes only — the 5 dormant niche shows stay
     unreferenced here too, same as everywhere else on the site now. -->
<section class="watch-section fade-up" id="watch-section" aria-label="Watch">
  <div class="container">
    <div class="watch-section-head fade-up">
      <span class="section-label">Watch</span>
      <a href="/shows.html" class="btn-link">All episodes →</a>
    </div>
    <div class="card-grid fade-up" id="watch-list">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</section>

<!-- LOCAL: Kenyan competitions specifically — distinct from the Discover
     tiles below, which jump into a whole sport, not one competition. -->
<section class="local-section fade-up" id="local-section" aria-label="Local competitions">
  <div class="container">
    <span class="section-label fade-up">Local Competitions</span>
    <div class="local-list fade-up" id="local-list">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</section>

<!-- Hidden entirely (not an empty-state) when the visitor follows nothing —
     purely localStorage-driven, js/home.js decides visibility at render time. -->
<section class="following-section fade-up" id="following-section" aria-label="Following" style="display:none;">
  <div class="container">
    <span class="section-label fade-up">Following</span>
    <div class="following-list fade-up" id="following-list"></div>
  </div>
</section>

<!-- READ: everything from the old Top Stories grid except the single
     lead item, which now lives in its own TOP section above. -->
<section class="stories-section" id="editorial-section" aria-label="More stories">
  <div class="container">
    <span class="section-label fade-up">Read</span>
    <div class="fade-up">
      <div class="stories-r1" id="stories-r1"></div>
      <div class="stories-r2" id="stories-r2"></div>
    </div>
  </div>
</section>

<section class="archive-teaser-section" id="stories" aria-label="Latest news">
  <div class="container">
    <span class="section-label fade-up">Latest</span>
    <p class="archive-teaser-sub fade-up">Quick, factual updates — not a firehose, just the day-to-day. <a href="/news.html">See all news &amp; articles →</a></p>

    <!-- populated live from /api/articles by js/home.js -->
    <div class="archive-list fade-up" id="archive-list"></div>
  </div>
</section>

<!-- DISCOVER (kept the "Sports" label — see note above) -->
<section class="sports-section" aria-label="Sports">
  <div class="container">
    <span class="section-label fade-up">Sports</span>
    <div class="sports-grid fade-up" id="sports-tiles-grid">
      <div class="empty-state">Loading…</div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="/js/nav-dropdown.js"></script>
<script src="/js/site.js"></script>
<script src="/js/follows.js"></script>
<script src="/js/scores.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
