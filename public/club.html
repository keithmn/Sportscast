<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club — The Sportscast</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .player-card { text-align: center; }
    .player-photo { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: var(--bg-elevated); margin-bottom: 0.6rem; }
    .player-photo-empty { width: 100%; aspect-ratio: 3/4; background: var(--bg-elevated); margin-bottom: 0.6rem; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: var(--text-micro); }
    .player-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.95rem; }
    .player-meta { font-size: var(--text-micro); color: var(--text-secondary); }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container" id="club-root">
    <div class="empty-state">Loading…</div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/site.js"></script>
  <script src="/js/club.js"></script>
</body>
</html>
