<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Articles — The Sportscast</title>
  <meta name="description" content="Fast updates and full features from Kenyan sport, categorized by sport — kept permanently, not a feed to keep up with.">
  <meta property="og:image" content="/brand/social/og-gold-1200x630.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Nunito:wght@400;600;700;900&family=Anton&display=swap" rel="stylesheet">
  <link rel="icon" href="/brand/favicon/favicon-32.png" sizes="32x32">

<body>
  <div id="nav-placeholder"></div>

  <header class="page-header">
    <div class="container">
      <h1 class="page-title">News &amp; Articles</h1>
      <p class="page-sub">The fast updates and the deep features, both kept — not a feed to keep up with, a record you can come back to.</p>
    </div>
  </header>

  <div class="page-body">
    <div class="container">
      <div class="filter-row" id="news-filters"></div>

      <section style="margin-bottom:3.5rem;">
        <span class="section-label">Latest</span>
        <div class="archive-list" id="latest-root">
          <div class="empty-state">Loading…</div>
        </div>
      </section>

      <section>
        <span class="section-label">Stories</span>
        <div class="card-grid" id="stories-root">
          <div class="empty-state">Loading…</div>
        </div>
      </section>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/nav-dropdown.js"></script>
  <script src="/js/site.js"></script>
