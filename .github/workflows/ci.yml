name: CI

# boot-and-migrate is deliberately narrow (catch a bad migration, a
# boot-time crash, a known-high/critical dependency vuln) — it predates
# any real test coverage and still runs first/fast as a cheap floor.
# e2e (added 2026-09-13, closing audit gap #11 "no automated browser/UI
# acceptance suite") is the actual test suite: Playwright against a real,
# freshly seeded SQLite DB and a real running server — see
# playwright.config.js and e2e/*.spec.js. Kept as a separate job so a
# flaky/slow UI test never blocks the fast boot check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  boot-and-migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci-test.db
      SESSION_SECRET: ci-test-secret-not-used-in-production
      PORT: 3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations against a throwaway SQLite database
        run: npx prisma migrate deploy

      - name: Boot the server and confirm it responds
        run: |
          node server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/api/sports > /dev/null; then
              echo "Server responded — boot OK"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server never responded within 10s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

      - name: Fail on known high/critical dependency vulnerabilities
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run e2e
